<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* phones + small tablets: whole app at 88% (layout widens to fill the screen); max-scale stops iOS zooming into inputs */
if (Math.min(screen.width, screen.height) <= 820) document.querySelector('meta[name=viewport]').content = 'width=device-width, initial-scale=0.88, minimum-scale=0.88, maximum-scale=0.88, viewport-fit=cover';</script>
<title>Notes</title>
<meta name="description" content="Notes: catatan sederhana dengan favorit, kategori, tag, checklist, arsip dan sampah — sinkron real time di HP dan laptop.">
<meta name="theme-color" content="#f4f5f7">
<script>/* theme before first paint (no flash): mode, style (plain|glass), backdrop, accent */
(function () { var g = function (k) { try { return localStorage.getItem('notes.' + k); } catch (e) { return null; } }, h = document.documentElement, m = g('theme') || 'auto';
  h.dataset.mode = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  h.dataset.style = g('style') || 'glass'; h.dataset.wall = g('wall') || 'mist'; h.dataset.acc = g('acc') || 'blue'; })();</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232563eb'/><path d='M30 30h40M30 50h40M30 70h24' fill='none' stroke='white' stroke-width='9' stroke-linecap='round'/></svg>">
<style>/* ---------- tokens ---------- */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --bg:#f4f5f7;--surface:#fff;--surface-2:#f3f4f6;--surface-solid:#fff;--hover:rgba(16,24,40,.055);
  --line:#e5e7eb;--line-2:#d8dbe1;--text:#14161a;--text-2:#3d424b;--muted:#6b7280;--red:#d92d20;--star:#f5a524;--na:55%;
  --shadow:0 1px 2px rgba(16,24,40,.04);--shadow-h:0 2px 4px rgba(16,24,40,.04),0 12px 28px -10px rgba(16,24,40,.18);--shadow-lg:0 24px 64px -12px rgba(16,24,40,.3);
  --sheen:linear-gradient(transparent,transparent);--blur:none;
  --acc:var(--acc-l,#2563eb);--acc-ink:#fff;--acc-soft:color-mix(in srgb,var(--acc) 11%,transparent);
  /* glass backdrops (light / dark) */
  --w-mist-l:radial-gradient(60% 55% at 12% 8%,#d6e4ff 0,transparent 70%),radial-gradient(50% 50% at 92% 18%,#efe3ff 0,transparent 70%),radial-gradient(60% 60% at 60% 100%,#d4f1ea 0,transparent 70%),#eef1f6;
  --w-mist-d:radial-gradient(60% 55% at 12% 8%,#1b2b4d 0,transparent 70%),radial-gradient(50% 50% at 92% 18%,#2b1f45 0,transparent 70%),radial-gradient(60% 60% at 60% 100%,#11332e 0,transparent 70%),#0c0f16;
  --w-aurora-l:radial-gradient(55% 50% at 8% 0%,#8fd0ff 0,transparent 70%),radial-gradient(50% 55% at 96% 22%,#c4a8ff 0,transparent 70%),radial-gradient(60% 55% at 38% 100%,#86e9cb 0,transparent 70%),#e8edf6;
  --w-aurora-d:radial-gradient(55% 50% at 8% 0%,#0f4a78 0,transparent 70%),radial-gradient(50% 55% at 96% 22%,#3e2a7c 0,transparent 70%),radial-gradient(60% 55% at 38% 100%,#0c5a48 0,transparent 70%),#090c13;
  --w-dusk-l:radial-gradient(55% 50% at 0% 0%,#ffd3b8 0,transparent 70%),radial-gradient(55% 50% at 100% 28%,#f8bcd6 0,transparent 70%),radial-gradient(60% 60% at 50% 100%,#cdbaff 0,transparent 70%),#f6eef0;
  --w-dusk-d:radial-gradient(55% 50% at 0% 0%,#5b2d22 0,transparent 70%),radial-gradient(55% 50% at 100% 28%,#58234a 0,transparent 70%),radial-gradient(60% 60% at 50% 100%,#2d2562 0,transparent 70%),#110c13;
  --w-ocean-l:radial-gradient(55% 50% at 5% 5%,#a3cbff 0,transparent 70%),radial-gradient(50% 50% at 95% 30%,#86e3ff 0,transparent 70%),radial-gradient(60% 60% at 45% 100%,#aab9ff 0,transparent 70%),#e8f0fb;
  --w-ocean-d:radial-gradient(55% 50% at 5% 5%,#0b3a70 0,transparent 70%),radial-gradient(50% 50% at 95% 30%,#06505f 0,transparent 70%),radial-gradient(60% 60% at 45% 100%,#1d2a6e 0,transparent 70%),#070b15;
  --w-graphite-l:radial-gradient(55% 50% at 10% 0%,#dfe2e7 0,transparent 70%),radial-gradient(50% 50% at 95% 35%,#e9e4dc 0,transparent 70%),radial-gradient(60% 60% at 50% 100%,#d9dde3 0,transparent 70%),#eceef1;
  --w-graphite-d:radial-gradient(55% 50% at 10% 0%,#2a2d33 0,transparent 70%),radial-gradient(50% 50% at 95% 35%,#2b2924 0,transparent 70%),radial-gradient(60% 60% at 50% 100%,#22262c 0,transparent 70%),#101114;
  --wall:var(--wall-l,var(--w-mist-l));
  color-scheme:light}
[data-mode=dark]{
  --bg:#0f1115;--surface:#171a1f;--surface-2:#1e2228;--surface-solid:#171a1f;--hover:rgba(255,255,255,.06);
  --line:#262a31;--line-2:#343944;--text:#eceef2;--text-2:#c5c9d1;--muted:#8d939e;--red:#ff6b61;--star:#fbbf24;--na:26%;
  --shadow:none;--shadow-h:0 12px 28px -10px rgba(0,0,0,.6);--shadow-lg:0 24px 64px -12px rgba(0,0,0,.7);
  --acc:var(--acc-d,#6b9bff);--acc-ink:#0b0d12;--acc-soft:color-mix(in srgb,var(--acc) 15%,transparent);
  --wall:var(--wall-d,var(--w-mist-d));
  color-scheme:dark}
[data-acc=blue]{--acc-l:#2563eb;--acc-d:#6b9bff}
[data-acc=violet]{--acc-l:#6d4fe0;--acc-d:#a693ff}
[data-acc=green]{--acc-l:#16803c;--acc-d:#4ade80}
[data-acc=amber]{--acc-l:#d97706;--acc-d:#fbbf24}
[data-acc=rose]{--acc-l:#e11d48;--acc-d:#fb7185}
[data-acc=mono]{--acc-l:#27272a;--acc-d:#e4e4e7}
[data-wall=mist]{--wall-l:var(--w-mist-l);--wall-d:var(--w-mist-d)}
[data-wall=aurora]{--wall-l:var(--w-aurora-l);--wall-d:var(--w-aurora-d)}
[data-wall=dusk]{--wall-l:var(--w-dusk-l);--wall-d:var(--w-dusk-d)}
[data-wall=ocean]{--wall-l:var(--w-ocean-l);--wall-d:var(--w-ocean-d)}
[data-wall=graphite]{--wall-l:var(--w-graphite-l);--wall-d:var(--w-graphite-d)}
/* liquid glass: translucent surfaces, frosted blur, bright rim + soft sheen over a colour backdrop */
[data-style=glass]{
  --surface:rgba(255,255,255,.56);--surface-2:rgba(255,255,255,.4);--surface-solid:rgba(255,255,255,.8);--hover:rgba(16,24,40,.06);
  --line:rgba(255,255,255,.72);--line-2:rgba(16,24,40,.11);
  --rim:linear-gradient(140deg,rgba(255,255,255,.95),rgba(255,255,255,.18) 38%,rgba(255,255,255,.05) 62%,rgba(255,255,255,.7));
  --sheen:linear-gradient(165deg,rgba(255,255,255,.42),rgba(255,255,255,0) 46%);
  --blur:saturate(185%) blur(22px);
  --shadow:0 1px 1px rgba(16,24,40,.03),0 8px 24px -10px rgba(16,24,40,.16);--shadow-h:0 2px 6px rgba(16,24,40,.05),0 18px 36px -14px rgba(16,24,40,.28)}
[data-style=glass][data-mode=dark]{
  --surface:rgba(32,35,44,.5);--surface-2:rgba(44,48,58,.38);--surface-solid:rgba(24,27,34,.84);--hover:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.1);--line-2:rgba(255,255,255,.13);
  --rim:linear-gradient(140deg,rgba(255,255,255,.34),rgba(255,255,255,.04) 38%,rgba(255,255,255,0) 62%,rgba(255,255,255,.2));
  --sheen:linear-gradient(165deg,rgba(255,255,255,.07),rgba(255,255,255,0) 46%);
  --shadow:0 10px 30px -12px rgba(0,0,0,.55);--shadow-h:0 20px 40px -14px rgba(0,0,0,.7)}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:14.5px/1.5 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
[data-style=glass] body{background:transparent}
[data-style=glass] body::before{content:'';position:fixed;inset:0;z-index:-1;background:var(--wall)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surface-solid);border:1px solid var(--line-2);border-radius:9px;padding:8px 11px;min-width:0;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:3px solid var(--acc-soft);border-color:var(--acc)}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:block}
.muted{color:var(--muted)}.small{font-size:13px}
kbd{font:500 11.5px/1 var(--font);color:var(--muted);border:1px solid var(--line-2);border-radius:5px;padding:3px 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);border-radius:9px;font-weight:550;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn .i{width:16px;height:16px}
.btn:hover{background:color-mix(in srgb,var(--text) 5%,var(--surface))}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.primary{background:var(--acc);border-color:transparent;color:var(--acc-ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--acc) 88%,var(--text))}
.btn.danger{color:var(--red)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}.btn.ghost:hover{color:var(--text);background:var(--hover)}
.btn.on{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,transparent);background:var(--acc-soft)}
.btn:disabled{opacity:.6;cursor:default}
.ib{width:36px;height:36px;border:0;background:none;border-radius:9px;display:inline-grid;place-items:center;color:var(--muted);cursor:pointer;padding:0;flex:none}
.ib .i{width:19px;height:19px}
.ib:hover{background:var(--hover);color:var(--text)}
.ib.on{color:var(--acc)}
.ib.fv.on{color:var(--star)}.ib.fv.on .i{fill:currentColor}
.ib:disabled{opacity:.32;cursor:default;background:none}
.ib.sm{width:28px;height:28px;margin:-4px -7px 0 0;border-radius:7px}.ib.sm .i{width:17px;height:17px}
.sel{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 4px 0 10px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);color:var(--muted)}
.sel .i{width:15px;height:15px}
.sel select{border:0;background:none;padding:0 6px;height:100%;font-size:13px;color:var(--text);outline:0!important;cursor:pointer}
.sel:focus-within{border-color:var(--acc)}
.segv{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface)}
.segv button{width:30px;height:26px;border:0;border-radius:6px;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.segv button .i{width:16px;height:16px}
.segv button.on{background:color-mix(in srgb,var(--text) 8%,transparent);color:var(--text)}

/* glass surfaces */
[data-style=glass] :is(.top,.side,.ncard,.quick,dialog,.toast,.gate-card,.acct,.search,.btn,.sel,.segv,.secbtn,.tbl-menu,.ed-find,.m-row,.card){-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
[data-style=glass] :is(.side,.ncard,.quick,.gate-card,.toast,.card){background:var(--sheen),var(--surface)}
[data-style=glass] :is(.ncard,.quick,.gate-card,.pad){position:relative} /* .side is sticky, already a containing block */
[data-style=glass] :is(.side,.ncard,.quick,.gate-card)::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--rim);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
[data-style=glass] :is(.ncard,.quick,.gate-card,.side){border-color:transparent}

/* ---------- top bar (clock top left) ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
[data-style=glass] .top{background:var(--sheen),var(--surface);box-shadow:inset 0 -1px 0 rgba(255,255,255,.18),0 6px 24px -18px rgba(16,24,40,.4)}
.top-in{height:64px;padding:0 24px;display:grid;grid-template-columns:240px minmax(0,1fr) auto;align-items:center;gap:28px}
.clock{display:flex;flex-direction:column;justify-content:center;line-height:1.2;min-width:0;user-select:none}
.ck-t{font-size:21px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.ck-d{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck-s{display:none}
.search{display:flex;align-items:center;gap:10px;height:40px;max-width:640px;width:100%;padding:0 10px 0 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--muted)}
.search:focus-within{border-color:var(--acc);background:var(--surface-solid);box-shadow:0 0 0 3px var(--acc-soft)}
.search input{flex:1;border:0;outline:0!important;background:none;padding:0;height:100%;font-size:14px;box-shadow:none}
.search input::-webkit-search-cancel-button{opacity:.5}
.top-r{display:flex;align-items:center;gap:4px}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);white-space:nowrap;margin-right:8px;font-variant-numeric:tabular-nums}
.sync .dot{width:7px;height:7px;border-radius:50%;background:#22a06b;box-shadow:0 0 0 3px color-mix(in srgb,#22a06b 18%,transparent)}
.sync[data-st=busy] .dot{background:#f5a524;box-shadow:0 0 0 3px color-mix(in srgb,#f5a524 18%,transparent);animation:pulse 1.2s ease-in-out infinite}
.sync[data-st=err]{color:var(--red)}.sync[data-st=err] .dot{background:var(--red);box-shadow:none}
@keyframes pulse{50%{opacity:.35}}
.acct{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 9px 0 4px;margin-left:4px;border:1px solid var(--line);background:var(--surface);border-radius:99px;cursor:pointer;font-weight:550;font-size:13.5px;max-width:200px}
.acct .un{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .cv{width:15px;height:15px;color:var(--muted)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--acc);color:var(--acc-ink);font-size:13px;font-weight:650}
.av .i{width:15px;height:15px}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;padding:0 24px}
.side{position:sticky;top:64px;align-self:start;max-height:calc(100dvh - 64px);overflow:auto;padding:18px 0 32px;display:flex;flex-direction:column;gap:1px;scrollbar-width:thin}
[data-style=glass] .side{top:78px;margin-top:14px;max-height:calc(100dvh - 92px);padding:12px 8px 14px;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;letter-spacing:-.01em;padding:2px 10px 14px}
.logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink);flex:none}
.logo .i{width:16px;height:16px}
.owner{margin:0 0 10px;width:100%}
.nav{display:flex;align-items:center;gap:11px;width:100%;height:36px;padding:0 10px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;color:var(--text-2);font-size:14px;font-weight:500;flex:none}
.nav:hover{background:var(--hover);color:var(--text)}
.nav.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.nav .ic{color:var(--muted);display:grid}.nav.on .ic{color:var(--acc)}
.nav .i{width:17px;height:17px}
.nav .lb{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.nav.on .n{color:var(--acc)}
.side-h{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:18px 10px 6px;flex:none}
.mini{border:0;background:none;color:var(--acc);font:600 12px var(--font);cursor:pointer;text-transform:none;letter-spacing:0;padding:2px 6px;border-radius:5px}
.mini:hover{background:var(--acc-soft)}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:2px 10px 2px}
.tagb{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;border:1px solid var(--line-2);background:none;border-radius:6px;font-size:12.5px;cursor:pointer;color:var(--text-2)}
.tagb small{color:var(--muted);font-size:11px}
.tagb:hover{background:var(--hover)}
.tagb.on{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.side-sep{height:1px;background:var(--line-2);margin:14px 10px;flex:none}
main{min-width:0;padding:24px 0 100px}
.secbtn{all:unset;display:inline-flex;align-items:center;gap:10px;font:inherit;color:inherit}
.secbtn .si{display:none}
.secbtn .i{width:18px;height:18px}
.m-only{display:none!important}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head-l{min-width:0}
.head h1{margin:0;font-size:24px;font-weight:650;letter-spacing:-.02em;line-height:1.25}
.hc{font-size:14px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.quick{display:flex;align-items:center;gap:8px;height:50px;padding:0 8px 0 16px;margin:0 0 24px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);color:var(--muted);cursor:text;font-size:14.5px}
.quick:hover{box-shadow:var(--shadow-h)}
.q-ph{flex:1}
.lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:2px 2px 10px}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);padding:80px 16px;text-align:center}
.empty .i{width:34px;height:34px;stroke-width:1.4;opacity:.55}
.empty p{margin:0;max-width:360px}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-items:stretch;margin-bottom:26px}
.grid.list{grid-template-columns:1fr;gap:8px}
.ncard{position:relative;display:flex;flex-direction:column;min-width:0;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .2s,transform .2s;overflow:hidden}
.ncard:hover{border-color:var(--line-2);box-shadow:var(--shadow-h)}
[data-style=glass] .ncard:hover{transform:translateY(-1px)}
.ncard:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ncard.col{background:var(--sheen),color-mix(in srgb,var(--nc) var(--na),var(--surface));border-color:color-mix(in srgb,var(--nc) 55%,var(--line))}
[data-style=glass] .ncard.col{border-color:transparent}
.nh{display:flex;align-items:flex-start;gap:8px}
.nh h3{flex:1;margin:0 0 6px;font-size:15px;font-weight:600;line-height:1.4;letter-spacing:-.005em;overflow-wrap:anywhere}
.ncard .fv{opacity:0;transition:opacity .15s}
.ncard:hover .fv,.ncard:focus-within .fv,.ncard .fv.on{opacity:1}
@media (hover:none){.ncard .fv{opacity:1}}
.nb{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;line-height:1.55;color:var(--text-2);max-height:14em;overflow:hidden}
.nb a,.rt a{color:var(--acc)}
.ht{color:var(--acc);font-weight:600}
.cl{display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--text-2)}
.cli{display:flex;gap:8px;align-items:flex-start}
.cli.dn span:last-child{text-decoration:line-through;color:var(--muted)}
.cb{border:0;background:none;padding:2px 0 0;cursor:pointer;color:var(--muted);display:grid}
.cb .i{width:16px;height:16px}
.cli.dn .cb{color:var(--acc)}
.cl-sum{font-size:12px;color:var(--muted);margin-top:4px}
.nf{margin-top:auto;padding-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.nf-i .i{width:14px;height:14px}
.cat{padding:1px 8px;border-radius:5px;background:color-mix(in srgb,var(--text) 7%,transparent);color:var(--text-2);font-weight:500}
.ago{margin-left:auto;white-space:nowrap}
.who{color:var(--acc);font-weight:600}
/* locked note: content stays blurred until the PIN is entered */
.pvw{position:relative;min-height:76px;border-radius:9px;overflow:hidden}
.pv.sealed{filter:blur(7px) saturate(.7);opacity:.75;transform:scale(1.03);user-select:none;pointer-events:none}
.seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--surface-solid);border:1px solid var(--line-2);box-shadow:var(--shadow-h);font-size:12.5px;font-weight:600;color:var(--text-2);white-space:nowrap;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.seal .i{width:14px;height:14px;color:var(--acc)}
.fab{display:none}

/* ---------- dialogs ---------- */
dialog{border:0;border-radius:16px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--surface-solid);color:var(--text);box-shadow:0 0 0 1px var(--line-2),var(--shadow-lg)}
[data-style=glass] dialog{background:var(--sheen),var(--surface-solid);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 1px var(--line),var(--shadow-lg)}
dialog::backdrop{background:rgba(12,16,24,.38);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
dialog.ed{width:min(920px,calc(100vw - 48px));height:min(800px,calc(100dvh - 48px))}
dialog.ed .ed-in{height:100%;min-height:0}
dialog.ed.col{background:var(--sheen),color-mix(in srgb,var(--nc) var(--na),var(--surface-solid))}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0;font-size:18px;font-weight:650;letter-spacing:-.01em}
.ed-in{padding:14px 28px 18px;gap:8px;min-height:min(560px,calc(100dvh - 24px))}
.ed-bar{display:flex;align-items:center;gap:2px;margin:0 -8px}
.ed-bar .sp{flex:1}
.ed-div{width:1px;height:20px;background:var(--line-2);margin:0 6px}
.ed-bar .hb{color:var(--text-2)}
.e-title{border:0;background:none;font-size:26px;font-weight:650;letter-spacing:-.02em;padding:10px 0 4px;outline:0!important;box-shadow:none}
.e-title::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent)}
.e-body{border:0;background:none;flex:1;min-height:300px;resize:none;padding:4px 0;font-size:16px;line-height:1.65;outline:0!important;width:100%}
.e-body.rt{flex:1 1 0;min-height:160px;overflow:auto;padding:6px 2px;overflow-wrap:anywhere;cursor:text}
.e-body.rt[contenteditable=false]{cursor:default}
.e-body.rt:empty::before{content:attr(data-ph);color:var(--muted);pointer-events:none}
.rt table{border-collapse:collapse;margin:6px 0;max-width:100%}
.rt td,.rt th{border:1px solid color-mix(in srgb,var(--text) 20%,transparent);padding:4px 8px;min-width:48px;vertical-align:top;text-align:left}
.rt th{background:color-mix(in srgb,var(--text) 6%,transparent);font-weight:600}
.rt ul,.rt ol{margin:4px 0;padding-left:24px}
.rt p{margin:0}
.rt img{max-width:160px;max-height:120px;width:auto;height:auto;border-radius:8px;vertical-align:middle;cursor:zoom-in;margin:2px;border:1px solid color-mix(in srgb,var(--text) 14%,transparent)}
.nb.rt{white-space:normal}
.nb.rt img{max-width:90px;max-height:70px}
.nb.rt table{font-size:12px}
/* formatting toolbar */
.rt-bar{display:flex;gap:2px;align-items:stretch;padding:4px;border:1px solid var(--line-2);border-radius:11px;background:color-mix(in srgb,var(--surface-solid) 70%,transparent)}
.rt-bar[hidden]{display:none!important}
.rt-bar>*{flex:1 1 0;min-width:0;height:32px}
.rt-bar>.rw{flex:2.6 1 0}
.rt-bar select{border:0;background:none;padding:0 6px;font-size:13px;border-radius:7px;cursor:pointer}
.rt-bar select:hover{background:var(--hover)}
.rb{border:0;background:none;color:var(--text-2);cursor:pointer;min-width:0;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;padding:0 4px;position:relative}
.rb .i{width:17px;height:17px}
.rb:hover{background:var(--hover);color:var(--text)}
.rb.on{background:var(--acc-soft);color:var(--acc)}
.rt-bar .tb{font-size:13px;white-space:nowrap}
.rc input{position:absolute;left:8px;right:8px;bottom:3px;width:auto;height:4px;padding:0;border:0;border-radius:2px;cursor:pointer;-webkit-appearance:none;appearance:none}
.rc input::-webkit-color-swatch-wrapper{padding:0}.rc input::-webkit-color-swatch{border:0;border-radius:2px}
.rc span,.rc .i{margin-top:-4px}.rc span{font-weight:700}
.rt-tog{margin:2px 0}
.tbl-menu{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;padding:12px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface-solid);box-shadow:var(--shadow-h)}
.tbl-new{display:flex;flex-direction:column;gap:6px}
.tbl-grid{display:grid;grid-template-columns:repeat(var(--c),20px);gap:3px}
.tbl-grid button{width:20px;height:20px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);padding:0;cursor:pointer}
.tbl-grid button.on,.tbl-grid button:hover{background:color-mix(in srgb,var(--acc) 40%,transparent);border-color:var(--acc)}
.tbl-ops{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;flex:1;min-width:220px}
.tbl-ops>span{flex-basis:100%}
.ed-find{display:flex;align-items:center;gap:4px;padding:2px 4px 2px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface)}
.ed-find>.i{width:16px;height:16px;color:var(--muted)}
.ed-find input{flex:1;border:0;background:none;padding:7px 6px;outline:0!important;box-shadow:none}
.ed-find .ib{width:30px;height:30px}
.ed-find #f-n{min-width:4.5em;text-align:right;white-space:nowrap}
::highlight(fnd){background-color:color-mix(in srgb,var(--star) 45%,transparent);color:inherit}
::highlight(fnd-cur){background-color:var(--acc);color:var(--acc-ink)}
.cl-row.hit{background:color-mix(in srgb,var(--star) 22%,transparent);border-radius:6px}
.cl-row.cur{outline:2px solid var(--acc)}
#zoom{background:transparent;box-shadow:none;width:fit-content;height:fit-content;margin:auto;max-width:96vw;max-height:96dvh;padding:0;overflow:visible;cursor:zoom-out}
#zoom::backdrop{background:rgba(0,0,0,.85)}
#zoom img{display:block;max-width:96vw;max-height:92dvh;border-radius:8px}
#zoom .zx{position:fixed;top:14px;right:16px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:26px;cursor:pointer}
.e-title:disabled,.e-body:disabled{color:var(--text);-webkit-text-fill-color:var(--text);opacity:1}
/* checklist editor */
.cl-ed{flex:1;min-height:200px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.cl-row{display:flex;align-items:center;gap:10px}
.cl-row input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--acc);margin:0}
.cl-row input[type=text]{flex:1;border:0;background:none;padding:7px 2px;border-bottom:1px solid transparent;border-radius:0;outline:0;box-shadow:none}
.cl-row input[type=text]:focus{border-bottom-color:var(--line-2)}
.cl-row.dn input[type=text]{text-decoration:line-through;color:var(--muted)}
.cl-row.add>span{width:18px;display:grid;place-items:center;color:var(--muted)}.cl-row.add .i{width:16px;height:16px}
.cl-done{margin:12px 0 2px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;display:grid}
.x:hover{background:var(--hover);color:var(--text)}.x .i{width:16px;height:16px}
/* editor options */
.ed-tog{display:block;margin:2px 0}
.ed-tog .et{width:100%;height:20px;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;margin:0;color:var(--muted);cursor:pointer}
.ed-tog .et .i{width:16px;height:16px}
.ed-tog .et::before,.ed-tog .et::after{content:'';flex:1;height:1px;background:var(--line-2)}
.ed-tog .et:hover{color:var(--acc)}.ed-tog .et:hover::before,.ed-tog .et:hover::after{background:color-mix(in srgb,var(--acc) 50%,transparent)}
.ed-low{display:flex;flex-direction:column;gap:10px}.ed-low[hidden]{display:none}
.ed-opts{display:flex;gap:10px;align-items:center}
.ed-opts .sel{flex:1 1 0;min-width:0;height:32px}.ed-opts .sel select{flex:1;min-width:0}
.ed-opts>.btn{flex:0 1 auto}
.swatch{display:flex;gap:6px;flex-wrap:wrap}
.swatch label{position:relative;display:grid}
.swatch input{position:absolute;opacity:0;pointer-events:none}
.swatch span{display:block;width:22px;height:22px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--text) 16%,transparent)}
.swatch span.none{background:linear-gradient(135deg,transparent 46%,var(--muted) 46% 54%,transparent 54%),var(--surface)}
.swatch input:checked+span{outline:2px solid var(--text);outline-offset:2px}
.ed-foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ed-foot .sp{display:none}.ed-foot #e-info{flex:1 1 auto}
.fld{display:flex;flex-direction:column;gap:8px}
.fld>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.fld[hidden]{display:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg>label{flex:1;min-width:80px;position:relative}
.seg>.btn{flex:1}
.seg input[type=radio]{position:absolute;opacity:0;pointer-events:none}
.seg label span{display:block;text-align:center;border:1px solid var(--line-2);border-radius:9px;padding:8px;cursor:pointer;font-weight:550;font-size:13.5px}
.seg input:checked+span{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.dlg-f .sp{flex:1}
.cats{display:flex;flex-direction:column;gap:6px}
.catrow{display:flex;gap:6px;align-items:center}
.catrow input{flex:1}
.catrow .ci{width:34px;display:grid;place-items:center;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.check input{width:16px;height:16px;accent-color:var(--acc);margin:0}
/* account + theme menus */
.m-head{display:flex;align-items:center;gap:12px}
.av.lg{width:44px;height:44px;font-size:18px}.av.lg .i{width:20px;height:20px}
.m-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;color:var(--text)}
.m-row:hover{border-color:var(--acc)}
.m-row>.i{color:var(--acc)}
.m-row>span{flex:1;display:flex;flex-direction:column}
.m-row small{color:var(--muted);font-size:12.5px}
.m-row .rt{transform:rotate(-90deg);color:var(--muted)}
.styles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.styles label,.walls label,.accs label{position:relative}
.styles input,.walls input,.accs input{position:absolute;opacity:0;pointer-events:none}
.sty{display:flex;flex-direction:column;gap:1px;padding:10px;border:1px solid var(--line-2);border-radius:12px;cursor:pointer;height:100%}
.sty b{font-size:13.5px;font-weight:600}.sty small{font-size:12px;color:var(--muted)}
.sty i{position:relative;display:block;height:62px;border-radius:8px;margin-bottom:8px;overflow:hidden}
.sw-plain{background:linear-gradient(90deg,#e9ebef 0 30%,transparent 30%),#f6f7f9;box-shadow:inset 0 0 0 1px #e1e4e9}
.sw-plain::after{content:'';position:absolute;left:38%;right:10%;top:14px;height:34px;border-radius:5px;background:#fff;box-shadow:0 0 0 1px #e1e4e9}
.sw-glass{background:var(--w-aurora-l)}
.sw-glass::after{content:'';position:absolute;inset:12px 16px;border-radius:7px;background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.85);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
input:checked+.sty{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.walls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.walls label{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.walls small{font-size:12px;color:var(--muted)}
.wt{display:block;width:100%;aspect-ratio:1.4;border-radius:9px;box-shadow:inset 0 0 0 1px var(--line-2)}
.wt[data-w=mist]{background:var(--w-mist-l)}.wt[data-w=aurora]{background:var(--w-aurora-l)}.wt[data-w=dusk]{background:var(--w-dusk-l)}.wt[data-w=ocean]{background:var(--w-ocean-l)}.wt[data-w=graphite]{background:var(--w-graphite-l)}
[data-mode=dark] .wt[data-w=mist]{background:var(--w-mist-d)}[data-mode=dark] .wt[data-w=aurora]{background:var(--w-aurora-d)}[data-mode=dark] .wt[data-w=dusk]{background:var(--w-dusk-d)}[data-mode=dark] .wt[data-w=ocean]{background:var(--w-ocean-d)}[data-mode=dark] .wt[data-w=graphite]{background:var(--w-graphite-d)}
input:checked+.wt{outline:2px solid var(--acc);outline-offset:2px}
.accs{display:flex;gap:12px;flex-wrap:wrap}
.accs span{display:block;width:28px;height:28px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.accs input:checked+span{outline:2px solid var(--text);outline-offset:3px}
/* note PIN pad */
dialog.pdlg{width:min(340px,calc(100vw - 32px))}
.pad{padding:28px 24px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.pad h2{margin:0;font-size:18px;font-weight:650;letter-spacing:-.01em}
.pad p{margin:0}
.pad-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);margin-bottom:10px}
.pad-ic .i{width:24px;height:24px}
.pad-note{margin-top:8px!important;max-width:100%;padding:4px 10px;border-radius:7px;background:var(--hover);font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pad-dots{position:relative;margin:18px 0 2px;padding:6px 10px;cursor:text}
.pad-dots input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;caret-color:transparent}
.dots{display:flex;gap:14px;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--muted);transition:background .12s,border-color .12s,transform .12s}
.dots i.on{background:var(--acc);border-color:var(--acc);transform:scale(1.08)}
.pad-dots:focus-within .dots i:not(.on):first-of-type,.pad-dots:focus-within .dots i.on+i:not(.on){border-color:var(--acc)}
.pad-dots.bad .dots{animation:shake .38s}
.pad-dots.bad .dots i{border-color:var(--red)}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pad-err{min-height:20px;font-size:13px;color:var(--red)}
.pad-keys{display:grid;grid-template-columns:repeat(3,66px);gap:10px;margin:6px 0 8px}
.pad-keys button{height:52px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);font-size:20px;font-weight:500;cursor:pointer;color:var(--text);display:grid;place-items:center;padding:0;font-variant-numeric:tabular-nums;transition:transform .08s,background .12s}
.pad-keys button:hover{background:color-mix(in srgb,var(--text) 6%,var(--surface))}
.pad-keys button:active{transform:scale(.95)}
.pad-keys .pk-del,.pad-keys .pk-ok{border-color:transparent;background:none;color:var(--muted)}
.pad-keys .pk-ok{color:var(--acc)}
.pad-keys .i{width:22px;height:22px}
.pad-f{display:flex;justify-content:center;gap:4px;width:100%}
.pad-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0 6px}
/* misc */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:500;z-index:60;box-shadow:var(--shadow-lg);display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px)}
[data-style=glass] .toast{background:var(--sheen),var(--surface-solid);color:var(--text);box-shadow:0 0 0 1px var(--line),var(--shadow-lg)}
.toast button{border:0;background:none;color:var(--acc);font-weight:600;cursor:pointer;padding:0}
[data-mode=light]:not([data-style=glass]) .toast button{color:color-mix(in srgb,var(--acc) 55%,#fff)}
.toast[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.users{width:100%;border-collapse:collapse}
.users th,.users td{padding:10px 14px;border-top:1px solid var(--line-2);text-align:left;font-size:14px}
.users thead th{border-top:0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.users tr.click{cursor:pointer}.users tr.click:hover td{background:var(--hover)}
.users .i{width:16px;height:16px;color:var(--muted)}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
/* ---------- sign-in ---------- */
.gate{position:fixed;inset:0;display:grid;place-items:center;padding:16px;overflow:auto}
.gate-card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:34px 28px 24px;text-align:center;box-shadow:var(--shadow-lg)}
.gate .logo{width:52px;height:52px;border-radius:15px;margin:0 auto 16px}
.gate .logo .i{width:24px;height:24px}
.gate h1{margin:0;font-size:24px;font-weight:650;letter-spacing:-.02em}
.gate-sub{margin:4px 0 24px;color:var(--muted);font-size:14px}
.gate-field{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border:1px solid var(--line-2);border-radius:11px;background:var(--surface-solid);text-align:left;margin-bottom:10px;color:var(--muted)}
.gate-field:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.gate-field input{flex:1;background:none;border:0;outline:0!important;box-shadow:none;color:var(--text);font-size:15.5px;padding:0;height:100%}
.gate-field input::placeholder{color:var(--muted)}
.mask-wrap{position:relative;flex:1;display:block;min-width:0;height:100%}
.mask-wrap input,#user-mask{font:500 16px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}
.mask-wrap input{width:100%;-webkit-text-fill-color:transparent;color:transparent;caret-color:var(--text)}
.mask-wrap input::placeholder{-webkit-text-fill-color:var(--muted);font-family:var(--font);letter-spacing:0;font-weight:400}
#user-mask{position:absolute;inset:0;display:flex;align-items:center;pointer-events:none;color:var(--text);white-space:pre;overflow:hidden}
.gate-btn{width:100%;height:46px;margin-top:4px;font-size:15px;font-weight:600;border-radius:11px;background:var(--acc);border:0;color:var(--acc-ink);cursor:pointer}
.gate-btn:hover{background:color-mix(in srgb,var(--acc) 88%,var(--text))}
.gate-btn:disabled{opacity:.7}
.gate-err{color:var(--red);min-height:18px;margin-top:10px;font-size:13.5px}
.gate-note{color:var(--muted);font-size:12.5px;margin:6px 0 0;line-height:1.55}
.gate-note a{color:var(--acc);text-decoration:none;font-weight:550}
.gate .check{justify-content:center;color:var(--text-2);font-size:13.5px;margin:6px 0 12px}

/* ---------- desktop: full-screen app shell ----------
   header + sidebar + note area fill exactly one screen; only the note list (.mlist) scrolls */
@media (min-width:821px){
  :root{--sw:256px;--gut:18px}
  html,body{height:100%;overflow:hidden}
  #app{height:100dvh;display:flex;flex-direction:column}
  .top{flex:none}
  .top-in{grid-template-columns:var(--sw) minmax(0,1fr) auto;gap:var(--gut);padding:0 var(--gut)}
  .search{max-width:none}
  .wrap{flex:1;min-height:0;grid-template-columns:var(--sw) minmax(0,1fr);gap:var(--gut);padding:var(--gut)}
  .side,[data-style=glass] .side{position:relative;top:0;align-self:stretch;height:100%;max-height:none;margin:0;padding:12px 8px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
  [data-style=glass] .side{border-color:transparent;background:var(--sheen),var(--surface)}
  .side-sep{margin-top:auto} /* Arsip / Sampah sit at the bottom of the sidebar */
  main{display:flex;flex-direction:column;min-height:0;height:100%;padding:0}
  .head{flex:none;align-items:center;min-height:40px;margin-bottom:14px}
  .head h1{font-size:22px}
  .secbtn{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;cursor:default}
  .quick{flex:none;margin-bottom:16px}
  .mlist{flex:1;min-height:0;overflow:auto;margin:0 -8px;padding:4px 8px 28px;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--text) 22%,transparent) transparent;overscroll-behavior:contain}
  /* uniform tiles: every card in the grid has the same height, content fades at the bottom */
  .grid:not(.list){grid-template-columns:repeat(auto-fill,minmax(260px,1fr));grid-auto-rows:236px;gap:16px}

        { const r = await rpc('nt_put', { p_owner: S.user, p_pin: S.pin || null, p_items: b });

    let rows;

      S.users = r.users || []; LS.set('admin.users', JSON.stringify(S.users)); rows = r.rows || [];
    } else { const r = await rpc('nt_list', { p_owner: S.user, p_after: S.seq, p_pin: S.pin || null }); if (!r?.ok) { needPin(r?.pin); return; } rows = r.rows || []; }
    if (who !== cacheKey()) return;
    for (const r of rows) {
      const it = { id: r.id, owner: r.owner || S.user, kind: r.kind, data: r.data || {}, updated: Number(r.updated), deleted: !!r.deleted };
      const cur = S.items.get(key(it));

// realtime: supabase broadcast pings (no data inside), plus a 10 s check
let sb = null, chans = [];
async function liveStart() {
  try {
    if (!window.supabase) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    sb ||= window.supabase.createClient(SB_URL, SB_KEY);
    liveStop();
    const all = sb.channel('notes-all');
    if (S.admin) all.on('broadcast', { event: 'chg' }, () => syncNow());
    chans.push(all.subscribe());
    if (!S.admin) chans.push(sb.channel('notes-u-' + S.user).on('broadcast', { event: 'chg' }, () => syncNow()).subscribe());
  } catch {}
}
function liveStop() { if (sb) chans.forEach(c => sb.removeChannel(c)); chans = []; }
function ping() { for (const c of chans) try { c.send({ type: 'broadcast', event: 'chg', payload: { t: Date.now() } }); } catch {} }
const syncText = () => S.sync.err ? S.sync.err : S.sync.busy || S.queue.size ? 'Menyimpan…' : S.sync.at ? 'Tersinkron ' + hms(S.sync.at).slice(0, 5) : 'Menghubungkan…';
const syncState = () => S.sync.err ? 'err' : S.sync.busy || S.queue.size ? 'busy' : S.sync.at ? 'ok' : 'busy';
function showSync() { document.querySelectorAll('.sync').forEach(e => { e.dataset.st = syncState(); e.title = syncText(); const t = e.querySelector('.st'); if (t) t.textContent = syncText(); }); }

// ---------- login (same accounts & PIN as Planner) ----------
const sha = async t => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)))].map(x => x.toString(16).padStart(2, '0')).join('');
const pinHash = (name, pin) => sha('planner-pin:' + name + ':' + pin);
const PIN_MSG = { need: 'Masukkan PIN.', wrong: 'PIN salah.', locked: 'Terlalu banyak PIN salah. Coba lagi 15 menit lagi.', format: 'PIN harus 4–12 angka.', invalid: 'Nama pengguna tidak valid.' };
function needPin(code) { // server says this session's PIN is missing/wrong: back to the PIN screen
  const name = S.user; if (!name) return;
  liveStop(); LS.set('u.' + name + '.haspin', '1'); SS.del('pin.' + name);
  S.user = null; S.pin = ''; S.items = new Map(); S.queue = new Set(); S.seq = 0;
  S.gate = { name, msg: code === 'locked' ? PIN_MSG.locked : 'Akun ini memakai PIN. Masukkan PIN untuk melanjutkan.' };
  if (dlg().open) dlg().close(); render();
}
async function login(raw, pass, remember, pin) {
  const name = normUser(raw);
  if (!validUser(name)) throw new Error('Nama pengguna 3–32 karakter: huruf, angka, titik, garis bawah, atau tanda minus.');
  if (name === ADMIN) {
    if (!pass) throw new Error('Masukkan password Admin.');
    const r = await rpc('nt_admin', { p_pass: pass, p_after: 0 }).catch(e => { throw new Error('Tidak bisa menghubungi server (' + e.message + ').'); });
    if (!r?.ok) throw new Error(r?.locked ? 'Terlalu banyak percobaan salah. Coba lagi 15 menit lagi.' : 'Password Admin salah.');
    S.admin = true; S.user = null; S.pass = pass; S.owner = '';
    S.items = new Map(); S.seq = 0; S.users = r.users || [];
    for (const x of r.rows || []) { const it = { id: x.id, owner: x.owner, kind: x.kind, data: x.data || {}, updated: Number(x.updated), deleted: !!x.deleted }; S.items.set(key(it), it); S.seq = Math.max(S.seq, Number(x.seq)); }
    saveCache(); LS.set('admin.users', JSON.stringify(S.users)); S.sync.at = new Date();
    SS.set('admin', pass); if (remember) LS.set('session', JSON.stringify({ admin: true })); else LS.del('session');
  } else {
    let r = null;
    try { r = await rpc('pl_login', { p_owner: name, p_pin: pin || null }); } catch (e) { // offline: unlock with the PIN checked on this device before
      const h = LS.get('u.' + name + '.pinhash');
      if (h) { if (!pin) { const er = new Error(PIN_MSG.need); er.needPin = true; throw er; } if (await pinHash(name, pin) !== h) throw new Error(PIN_MSG.wrong); }
      else if (LS.get('u.' + name + '.haspin')) throw new Error('Tidak bisa menghubungi server (' + e.message + ').');
    }
    if (r && !r.ok) { const er = new Error(PIN_MSG[r.pin] || 'Gagal masuk.'); er.needPin = r.pin === 'need'; throw er; }
    S.admin = false; S.user = name; S.pass = ''; S.pin = pin || ''; S.gate = null;
    if (r) { S.hasPin = !!r.pin; if (r.pin) { LS.set('u.' + name + '.haspin', '1'); LS.set('u.' + name + '.pinhash', await pinHash(name, pin)); } else { LS.del('u.' + name + '.haspin'); LS.del('u.' + name + '.pinhash'); } }
    else S.hasPin = !!pin;
    if (pin) SS.set('pin.' + name, pin);
    loadCache(); S.purged = false;
    if (remember) LS.set('session', JSON.stringify({ user: name })); else { LS.del('session'); SS.set('user', name); }
    setTimeout(syncNow, 0);
  }
  S.sec = 'all'; S.q = '';
  liveStart();
}
function logout() {
  liveStop(); LS.del('session'); SS.del('admin'); SS.del('user'); if (S.user) SS.del('pin.' + S.user); S.pin = ''; S.gate = null;
  S.user = null; S.admin = false; S.pass = ''; S.items = new Map(); S.queue = new Set(); S.seq = 0; S.sync = { busy: false, again: false, at: null, err: '' };

}

// ---------- list logic ----------
function inSec(n, sec) {
  const d = n.data;
  if (sec === 'trash') return !!d.trashed;
  if (d.trashed) return false;
  if (sec === 'arch') return !!d.archived;
  if (d.archived) return false;
  if (sec === 'all') return true;
  if (sec === 'fav') return !!d.fav;
  if (sec === 'pin') return !!d.pinned;
  if (sec === 'nocat') return !catOf(n);
  if (sec.startsWith('cat:')) { const c = catOf(n); return !!c && (S.admin ? c.name === sec.slice(4) : c.id === sec.slice(4)); }
  if (sec.startsWith('tag:')) return tagsN(n).includes(sec.slice(4));
  return true;
}
function searchText(n) { const d = n.data, c = catOf(n); return (d.lock ? [d.title, c?.name, S.admin ? n.owner : ''] : [d.title, d.body, ...(d.items || []).map(i => i.t), c?.name, S.admin ? n.owner : '']).join(' ').toLowerCase(); }
function visible() {
  const q = S.q.trim().toLowerCase(), words = q.split(/\s+/).filter(Boolean);
  const cmp = { upd: (a, b) => b.updated - a.updated, new: (a, b) => (b.data.created || 0) - (a.data.created || 0), old: (a, b) => (a.data.created || 0) - (b.data.created || 0), az: (a, b) => (a.data.title || '').localeCompare(b.data.title || '', 'id') }[S.sort] || ((a, b) => b.updated - a.updated);
  return notes().filter(n => inSec(n, S.sec) && (!words.length || words.every(w => searchText(n).includes(w)))).sort(cmp);
}
const secName = sec => sec === 'all' ? 'Semua catatan' : sec === 'fav' ? 'Favorit' : sec === 'pin' ? 'Disematkan' : sec === 'arch' ? 'Arsip' : sec === 'trash' ? 'Sampah' : sec === 'nocat' ? 'Tanpa kategori'
  : sec.startsWith('tag:') ? '#' + sec.slice(4) : allCats().find(c => (S.admin ? c.name : c.id) === sec.slice(4))?.name || 'Kategori';
const secIcon = sec => ic({ all: 'note', fav: 'star', pin: 'pin', arch: 'archive', trash: 'trash', nocat: 'inbox', users: 'users' }[sec] || (sec.startsWith('tag:') ? 'hash' : 'folder'));
// page title; on phones it is the button that opens the section list (dropdown)
const secTitle = (label, n) => `<h1><button type="button" class="secbtn" data-a="secmenu" aria-expanded="${!!S.secOpen}"><span class="si">${secIcon(S.sec)}</span><span class="st-l">${esc(label)}</span><span class="hc">${n}</span><span class="caret m-only">${ic(S.secOpen ? 'chev-u' : 'chev-d')}</span></button></h1>`;

// ---------- clock (top left of the dashboard) ----------

const clockShort = d => `${DAYS[d.getDay()].slice(0, 3)}, ${d.getDate()} ${MON[d.getMonth()]}`;
const clockHtml = () => { const d = new Date(); return `<div class="clock" role="timer" aria-label="Jam sekarang"><span class="ck-t">${hms(d)}</span><span class="ck-d"><span class="ck-l">${clockDate(d)}</span><span class="ck-s">${clockShort(d)}</span></span></div>`; };

  let y = M;
  const line = (txt, size, lh, style = 'normal', color = 20) => {
    doc.setFont('helvetica', style); doc.setFontSize(size); doc.setTextColor(color);
    for (const l of doc.splitTextToSize(txt, TW)) { if (y + lh > H - M) { doc.addPage(); y = M; } doc.text(l, M, y + size); y += lh; }

  line(clean([c?.name, 'Dibuat ' + fullDT(d.created || Date.now()), n ? 'Diubah ' + fullDT(n.updated) : ''].filter(Boolean).join('  |  ')), 9, 14, 'normal', 120);

  for (let i = 1; i <= pages; i++) { doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(150); doc.text(`Notes - liemyo.github.io/notes`, M, H - 25); doc.text(`Hal ${i}/${pages}`, W - M, H - 25, { align: 'right' }); }
  doc.save(fileName(d) + '.pdf');
}

document.addEventListener('click', ev => {

document.addEventListener('keydown', ev => {

  }

  if (ev.key === 'Enter' && t.dataset?.ct !== undefined) { ev.preventDefault(); $('#cl-new')?.focus(); return; }
  if (ev.key === 'Backspace' && t.dataset?.ct !== undefined && !t.value) { ev.preventDefault(); histPush(); S.edit.d.items.splice(Number(t.dataset.ct), 1); editChanged(true); $('#cl-new')?.focus(); return; }
  if (ev.key === 'Enter' && t.id === 'e-title' && S.edit) { ev.preventDefault(); ($('#e-body') || $('#cl-new'))?.focus(); return; }

document.addEventListener('submit', ev => {

// ---------- auto update + boot ----------
async function checkUpdate() { // phones keep old copies; load the newer build when nothing is being edited
  if (dlg().open || S.queue.size) return;
  try {
    const r = await fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' }); const m = /const BUILD = '([^']+)'/.exec(await r.text());
    if (m && m[1] !== BUILD && m[1] !== '__BUILD__' && SS.get('reloaded') !== m[1]) { SS.set('reloaded', m[1]); location.replace(location.pathname + '?v=' + m[1]); }
  } catch {}
}
setInterval(() => { if (!document.hidden && !S.edit?.dirty) syncNow(); }, 10000);
setInterval(checkUpdate, 10 * 60e3);
setInterval(() => { if ((S.user || S.admin) && !dlg().open && !document.activeElement?.id) render(); }, 60000); // refresh "x mnt lalu"
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (S.edit) flushEdit(); } else syncNow(); });
window.addEventListener('pagehide', () => { if (S.edit) flushEdit(); });
window.addEventListener('online', () => syncNow());
window.addEventListener('focus', () => syncNow());

function boot() {
  applyTheme(); checkUpdate(); tick();
  let s = null; try { s = JSON.parse(LS.get('session') || 'null'); } catch {}
  const ssUser = SS.get('user'), ssAdmin = SS.get('admin');
  if (s?.admin || ssAdmin) {
    if (ssAdmin) { S.admin = true; S.pass = ssAdmin; loadCache(); render(); liveStart(); syncNow(); return; }
    LS.del('session'); // admin password is never stored on the device; ask again
  } else if (s?.user || ssUser) {
    const name = s?.user || ssUser, pin = SS.get('pin.' + name) || '';
    if (LS.get('u.' + name + '.haspin') && !pin) { S.gate = { name, msg: '' }; render(); return; } // PIN asked on every new visit
    S.user = name; S.pin = pin; S.hasPin = !!LS.get('u.' + name + '.haspin'); loadCache();
    if (S.sec === 'users') S.sec = 'all';
    render(); liveStart(); syncNow(); return;
  }
  render();
}
boot();
